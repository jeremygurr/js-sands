<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Falling‑Sands Playground</title>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <div id="toolbar">
    <button class="tool" data-id="1" aria-label="Sand (S)" style="background-color:#C2B280;"></button>
    <button class="tool" data-id="2" aria-label="Water (W)" style="background-color:#4A90E2;"></button>
    <button class="tool" data-id="3" aria-label="Stone (R)" style="background-color:#555555;"></button>
    <button class="tool" data-id="4" aria-label="Fire (F)" style="background-color:#FF4500;"></button>
    <button class="tool" data-id="0" aria-label="Eraser (E)" style="background-color:#000000;"></button>

    <button id="pauseBtn" aria-label="Pause (Space)"></button>
    <button id="clearBtn" aria-label="Clear (C)"></button>

    <span id="fps">— FPS</span>
  </div>

  <!-- External script (deferred so the DOM is ready) -->
  <script src="script.js" defer></script>
</body>
</html>
