<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Falling‑Sands Playground</title>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <div id="toolbar">
    <!-- -------------- TOOLS -------------- -->
    <button class="tool"
            data-id="2"
            aria-label="Sand (S)"
            title="Sand – press **S**"
            style="background-color:#C2B280;"></button>

    <button class="tool"
            data-id="3"
            aria-label="Water (W)"
            title="Water – press **W**"
            style="background-color:#4A90E2;"></button>

    <button class="tool"
            data-id="4"
            aria-label="Stone (R)"
            title="Stone – press **R**"
            style="background-color:#555555;"></button>

    <button class="tool"
            data-id="5"
            aria-label="Fire (F)"
            title="Fire – press **F**"
            style="background-color:#FF4500;"></button>

    <button class="tool"
            data-id="6"
            aria-label="Cloud (C)"
            title="Cloud – press **C**"
            style="background-color:#D0D0FF;"></button>

    <button class="tool"
            data-id="9"
            aria-label="Wood (T)"
            title="Wood – press **T**"
            style="background-color:#7C443A;"></button>

    <button class="tool"
            data-id="1"
            aria-label="Eraser (E)"
            title="Eraser – press **E**"
            style="background-color:#202020;"></button>

    <!-- -------------- CONTROLS -------------- -->
    <button id="pauseBtn"
            aria-label="Pause (Space)"
            title="Pause / Resume – press **Space**">
    </button>

    <button id="clearBtn"
            aria-label="Clear (!)"
            title="Clear the world – press **!**">
    </button>

    <!-- -------------- INFO -------------- -->
    <span id="fps">— FPS</span>
  </div>

  <!-- External script (deferred so the DOM is ready) -->
  <script src="script.js" defer></script>
</body>
</html>
